# Her main güncellemesinde Android APK derler ve GitHub Releases sayfasına koyar.
# Telefondan indirmek için (her zaman en yeni sürüm):
# https://github.com/BeyzanurKarademirli/MavidenSariya/releases/latest/download/Mavera.apk
name: Android APK

on:
  push:
    branches: [main]
    # Yalnızca belge/lisans değişikliklerinde boşuna APK derleme
    paths-ignore:
      - 'LICENSE'
      - '**.md'
      - 'screenshots/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SPOTIFY_CLIENT_ID: e88216ebc2604aa092c888bcdc5ed029
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıkları kur
        run: npm ci

      # Yapay zekâ sunucusu (Cloudflare Worker). Gerekli gizli anahtarlar GitHub → Settings → Secrets → Actions:
      #   CLOUDFLARE_API_TOKEN (Cloudflare "Edit Cloudflare Workers" şablonuyla oluşturulan token)
      #   GEMINI_API_KEY       (Google AI Studio'dan ücretsiz API anahtarı)
      # Anahtar yoksa ya da bir sorun çıkarsa APK yine derlenir; uygulama yapay zekâsız çalışır.
      - name: Yapay zekâ sunucusunu yayınla
        id: ai
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm ci
          node deploy.mjs

      - name: Android projesini oluştur
        env:
          EXPO_PUBLIC_AI_URL: ${{ steps.ai.outputs.ai_url }}
        run: npx expo prebuild --platform android --no-install

      - name: APK derle
        working-directory: android
        env:
          EXPO_PUBLIC_AI_URL: ${{ steps.ai.outputs.ai_url }}
        run: |
          echo "Yapay zekâ sunucusu: ${EXPO_PUBLIC_AI_URL:-yok}"
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Mavera.apk
          # Eski indirme bağlantısı da çalışmaya devam etsin
          cp app/build/outputs/apk/release/Mavera.apk app/build/outputs/apk/release/RuhHali.apk

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mâverâ (sürüm ${{ github.run_number }})
          body: |
            Telefona kurmak için aşağıdaki **Mavera.apk** dosyasına dokun, indir ve aç.
            Android "bilinmeyen kaynak" uyarısı verirse: Ayarlar → Bu kaynağa izin ver → Yükle.

            Yapay zekâ: ${{ steps.ai.outputs.ai_url && 'açık ✨' || 'kapalı (sunucu anahtarları henüz eklenmedi)' }}
          files: |
            android/app/build/outputs/apk/release/Mavera.apk
            android/app/build/outputs/apk/release/RuhHali.apk
          make_latest: true
